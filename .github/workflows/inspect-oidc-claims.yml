name: Day 73 - Inspect OIDC Claims

on:
  push:
    branches:
      - "feature/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-claims:
    name: Inspect safe OIDC claims
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Request token and display safe claims
        shell: bash
        run: |
          set -euo pipefail

          response="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"

          token="$(
            python -c \
              'import json, sys; print(json.load(sys.stdin)["value"])' \
              <<< "${response}"
          )"

          echo "::add-mask::${token}"

          OIDC_TOKEN="${token}" python - <<'PY'
          import base64
          import json
          import os

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          safe_keys = (
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
          )

          for key in safe_keys:
              print(f"{key}={claims.get(key)}")
          PY
