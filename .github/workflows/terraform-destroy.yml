name: "DANGER - Protected Terraform Destroy"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DESTROY-DEV to permanently destroy the dev environment"
        required: true
        type: string

      reason:
        description: "Reason for destroying the development environment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-dev
  queue: max

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: "infrastructure/terraform/envs/dev"

  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}

  TF_VAR_aws_region: ${{ vars.AWS_REGION }}

jobs:
  preflight:
    name: Validate destroy request
    runs-on: ubuntu-latest

    steps:
      - name: Require main and exact destroy confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          [[ "${GITHUB_REF}" == "refs/heads/main" ]]

          if [[ "${CONFIRMATION}" != "DESTROY-DEV" ]]
          then
            echo "Confirmation must be exactly DESTROY-DEV."
            exit 1
          fi

  destroy:
    name: Approved development teardown
    needs:
      - preflight

    environment:
      name: dev-destroy

    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure temporary destroy credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DESTROY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-destroy-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize S3 backend
        run: |
          terraform \
            -chdir="${TF_WORKING_DIR}" \
            init \
            -input=false \
            -lockfile=readonly \
            -no-color

      - name: Validate Terraform
        run: |
          terraform \
            -chdir="${TF_WORKING_DIR}" \
            validate \
            -no-color

      - name: Create exact destroy plan
        run: |
          terraform \
            -chdir="${TF_WORKING_DIR}" \
            plan \
            -destroy \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -out="${RUNNER_TEMP}/dev-destroy.tfplan"

      - name: Apply exact destroy plan
        run: |
          terraform \
            -chdir="${TF_WORKING_DIR}" \
            apply \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            "${RUNNER_TEMP}/dev-destroy.tfplan"

      - name: Remove temporary destroy plan
        if: always()
        run: rm -f "${RUNNER_TEMP}/dev-destroy.tfplan"
